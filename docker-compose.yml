services:
  backend:
    build: ./backend
    container_name: delhi-events-backend
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/packages"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8001/api}
    container_name: delhi-events-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
