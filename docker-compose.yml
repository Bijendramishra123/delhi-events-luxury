services:
  backend:
    build: ./backend
    container_name: delhi-events-backend
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: delhi-events-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped